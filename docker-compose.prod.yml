services:
  postgres:
    image: postgres:16-alpine
    container_name: bigdogcal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bigdogcal}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bigdogcal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bigdogcal-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCO_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-bigdogcal}
    ports:
      - "${APP_PORT:-5150}:5150"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
